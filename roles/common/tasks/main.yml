---
# ---------------------------------------------------------
# System updates
# ---------------------------------------------------------
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # only update if cache is older than 1 hour

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - unzip
      - ufw
    state: present

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

# ---------------------------------------------------------
# Deploy user
# GitHub Actions SSH user
# ---------------------------------------------------------
- name: Create deploy group
  ansible.builtin.group:
    name: deploy
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: deploy
    group: deploy
    shell: /bin/bash
    create_home: true
    state: present

- name: Create deploy user .ssh directory
  ansible.builtin.file:
    path: /home/deploy/.ssh
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"

- name: Add deploy user authorized key
  ansible.posix.authorized_key:
    user: deploy
    state: present
    key: "{{ deploy_public_key }}"

- name: Create web root directory
  ansible.builtin.file:
    path: /var/www/andrewflanigan.com
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"

# ---------------------------------------------------------
# SSH hardening
# ---------------------------------------------------------
- name: Harden SSH config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    mode: "0600"
  loop:
    - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
    - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
    - { regexp: "^#?X11Forwarding", line: "X11Forwarding no" }
    - { regexp: "^#?MaxAuthTries", line: "MaxAuthTries 3" }
  notify: Restart SSH

# ---------------------------------------------------------
# UFW firewall
# ---------------------------------------------------------
- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP through UFW
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS through UFW
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

# ---------------------------------------------------------
# fail2ban — bans IPs with too many failed SSH attempts
# ---------------------------------------------------------
- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# ---------------------------------------------------------
# AWS CLI
# ---------------------------------------------------------
- name: Download AWS CLI installer
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: "0644"
  when: cloud_provider == "aws"

- name: Unzip AWS CLI installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
  when: cloud_provider == "aws"

- name: Install AWS CLI
  ansible.builtin.command:
    cmd: /tmp/aws/install
    creates: /usr/local/bin/aws
  when: cloud_provider == "aws"

- name: Clean up AWS CLI installer
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/awscliv2.zip
    - /tmp/aws
  when: cloud_provider == "aws"
