---
- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Write Nginx site config from template
  template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/andrewflanigan.com
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable site (symlink to sites-enabled)
  file:
    src: /etc/nginx/sites-available/andrewflanigan.com
    dest: /etc/nginx/sites-enabled/andrewflanigan.com
    state: link
  notify: Reload Nginx

- name: Ensure Nginx is started and enabled
  service:
    name: nginx
    state: started
    enabled: true
