---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Write Nginx site config from template
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ site_domain.split(',')[0] }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable site (symlink to sites-enabled)
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ site_domain.split(',')[0] }}"
    dest: "/etc/nginx/sites-enabled/{{ site_domain.split(',')[0] }}"
    state: link
  notify: Reload Nginx

- name: Ensure Nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
