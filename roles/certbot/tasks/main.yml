---
- name: Install Certbot and Nginx plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Obtain Let's Encrypt certificate
  ansible.builtin.command: >
    certbot --nginx
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
    --domains andrewflanigan.com,www.andrewflanigan.com
    --redirect
  args:
    creates: /etc/letsencrypt/live/andrewflanigan.com/fullchain.pem
  notify: Reload Nginx

- name: Write full HTTPS Nginx config after Certbot has run
  ansible.builtin.template:
    src: site-https.conf.j2
    dest: /etc/nginx/sites-available/andrewflanigan.com
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Ensure Certbot auto-renewal timer is enabled
  ansible.builtin.service:
    name: certbot.timer
    state: started
    enabled: true
